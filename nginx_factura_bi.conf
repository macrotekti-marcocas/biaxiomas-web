# 3. Configuración para biaxiomas.com y Admin_tenant
server {
    listen 80;
    listen [::]:80;
    server_name biaxiomas.com www.biaxiomas.com;

    location /Admin_tenant/ {
        proxy_pass http://127.0.0.1:8001/;
