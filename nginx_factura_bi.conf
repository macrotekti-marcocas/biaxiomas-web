# ==============================================================================
# BIAXIOMAS & FACTURA BI - CONFIGURACIÓN ALTERNATIVA NGINX REVERSE PROXY
# ==============================================================================

# 1. Configuración para pollerialosgueros.com
server {
    listen 80;
    listen [::]:80;
    server_name pollerialosgueros.com www.pollerialosgueros.com;

    # Redirección a HTTPS gestionada por Certbot
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Configuración para el entorno de pruebas
server {
